request_api:
  description: >-
    Call any CatLink Cloud endpoint with the target entity's Account Session.
    Warning: this can also reach destructive endpoints, such as unbinding a
    Device. There is no denylist, so only call endpoints you trust.
  target:
    entity:
      integration: catlink
      domain: sensor
  fields:
    api:
      description: API path
      example: token/device/union/list/sorted
      required: true
      selector:
        text:
    params:
      description: Request params. Must be a mapping; a string is rejected.
      example: '{"deviceId": "1234567890"}'
      selector:
        object:
    method:
      description: Request method
      default: GET
      example: GET
      selector:
        select:
          options:
            - GET
            - POST
            - POST_GET
    throw:
      description: Also show the response as a persistent notification.
      default: true
      example: true
      selector:
        boolean: